appId: com.dentalclinic.desktop
productName: NetDental
directories:
  app: .runtime/desktop
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: .runtime/api
    to: api
  - from: apps/web/dist
    to: web
win:
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
asar: true
npmRebuild: false
