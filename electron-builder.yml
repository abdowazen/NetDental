appId: com.dentalclinic.desktop
productName: NetDenty
directories:
  app: .runtime/desktop
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: .runtime/api
    to: api
  - from: apps/web/dist
    to: web
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  signExecutable: false
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  shortcutName: NetDenty
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
asar: true
npmRebuild: false
