services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: dental_clinic
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["clinic_pg:/var/lib/postgresql/data"]
volumes:
  clinic_pg:
